&lt;script type=&quot;module&quot;&gt;
  const root = document.getElementById(&quot;stack3-resolution-study&quot;);

  const atlas = root.querySelector(&quot;[data-atlas]&quot;);
  const model = root.querySelector(&quot;[data-model]&quot;);
  const metric = root.querySelector(&quot;[data-metric]&quot;);
  const models = { wedge: &quot;쐐기&quot;, cylinder: &quot;원통&quot;, plate: &quot;얇은 판&quot; };
  const configs = Object.fromEntries([...root.querySelectorAll(&quot;[data-viz-chart]&quot;)].map(node =&gt;
    [node.dataset.case, JSON.parse(node.textContent)]));
  let chart;

  function renderModels() {
    angle.value = orbit.value + &quot;°&quot;;
    model.src = assets[shape.value].frames[Number(orbit.value) / 15];
    model.alt = models[shape.value] + &quot;의 기준 형상, 기본 메시, 고해상도 메시를 왼쪽부터 비교. 회전 &quot; + angle.value;

      const figure = document.createElement(&quot;figure&quot;);
      const img = document.createElement(&quot;img&quot;);

      img.width = 256;
      img.height = 184;
      const caption = document.createElement(&quot;figcaption&quot;);
      caption.className = &quot;text-small text-muted&quot;;
      caption.textContent = label;
      figure.append(img, caption);
      return figure;
    }));
    renderModels();
    metric.textContent = asset.metric;
    if (chart) chart.config = configs[shape.value];

  const saved = window.openai?.widgetState?.modelContent;
  if (saved?.shape in models) shape.value = saved.shape;
  if (Number.isInteger(saved?.angle) &amp;&amp; saved.angle &gt;= 0 &amp;&amp; saved.angle &lt;= 345 &amp;&amp; saved.angle % 15 === 0) {
