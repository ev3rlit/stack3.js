&lt;script type=&quot;module&quot;&gt;
  const root = document.getElementById(&quot;stack3-axis-resolution&quot;);
  const assets = JSON.parse(root.querySelector(&quot;[data-visual-assets]&quot;).textContent);
  const shape = root.querySelector(&quot;[data-shape]&quot;);
  const orbit = root.querySelector(&quot;#stack3-axis-azimuth&quot;);
  const angle = root.querySelector(&quot;[data-angle]&quot;);
  const atlas = root.querySelector(&quot;[data-atlas]&quot;);
  const model = root.querySelector(&quot;[data-model]&quot;);
  const metric = root.querySelector(&quot;[data-metric]&quot;);
  const models = { wedge: &quot;쐐기&quot;, cylinder: &quot;원통&quot;, plate: &quot;얇은 판&quot; };
  const configs = Object.fromEntries([...root.querySelectorAll(&quot;[data-viz-chart]&quot;)].map(node =&gt;
    [node.dataset.case, JSON.parse(node.textContent)]));
  let chart;

  function renderModels() {
    angle.value = orbit.value + &quot;°&quot;;
    model.src = assets[shape.value].frames[Number(orbit.value) / 15];
    model.alt = models[shape.value] + &quot;의 기준 형상, 기본, XY만 증가, 레이어만 증가, 둘 다 증가 메시를 왼쪽부터 비교. 회전 &quot; + angle.value;
  }

  function renderAsset() {
    const asset = assets[shape.value];
    atlas.replaceChildren(...asset.views.map(([label, uri]) =&gt; {
      const figure = document.createElement(&quot;figure&quot;);
      const img = document.createElement(&quot;img&quot;);
      img.alt = models[shape.value] + &quot; &quot; + label + &quot; 정사영&quot;;
      img.src = uri;
      img.width = 256;
      img.height = 184;
      const caption = document.createElement(&quot;figcaption&quot;);
      caption.className = &quot;text-small text-muted&quot;;
      caption.textContent = label;
      figure.append(img, caption);
      return figure;
    }));
    renderModels();
    metric.textContent = asset.metric;
    if (chart) chart.config = configs[shape.value];
  }

  const saved = window.openai?.widgetState?.modelContent;
  if (saved?.shape in models) shape.value = saved.shape;
  if (Number.isInteger(saved?.angle) &amp;&amp; saved.angle &gt;= 0 &amp;&amp; saved.angle &lt;= 345 &amp;&amp; saved.angle % 15 === 0) {
    orbit.value = saved.angle;
  }
  function save() {
    window.openai?.setWidgetState?.({ modelContent: { shape: shape.value, angle: Number(orbit.value) } })?.catch(() =&gt; {});
  }
  shape.addEventListener(&quot;change&quot;, () =&gt; { renderAsset(); save(); });
  orbit.addEventListener(&quot;input&quot;, renderModels);
  orbit.addEventListener(&quot;change&quot;, save);
  renderAsset();

  try {
    const { mountChart } = await import(&quot;https://persistent.oaistatic.com/plugins/visualize/charts/1.8.1/element.js&quot;);
    chart = mountChart(root.querySelector(&quot;[data-viz-container]&quot;), configs[shape.value]);
  } catch {
    const message = document.createElement(&quot;p&quot;);
    message.className = &quot;text-small text-muted&quot;;
    message.setAttribute(&quot;role&quot;, &quot;status&quot;);
    message.textContent = &quot;단면 차트를 불러오지 못했습니다.&quot;;
    root.querySelector(&quot;[data-viz-container]&quot;).append(message);
  }

    }

  delete frame.dataset.srcdoc;
})();
