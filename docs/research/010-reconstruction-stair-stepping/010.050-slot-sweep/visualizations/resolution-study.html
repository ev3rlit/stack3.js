  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);

  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;

  );

      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)

          typeof value === &quot;function&quot; ||

      isArray(parsedState)

    if (fileElement != null) {
      const files = parse(fileElement.textContent);
      fileElement.remove();
      const blobs = new Map();
      const urls = [];
      for (const [name, binding] of Object.entries(bindings)) {

      /** @param {string} name @param {(value: unknown) =&gt; void} callback */

    &quot;message&quot;,

        hostPort != null ||

      }

      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);

              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;

              if (typeof id !== &quot;number&quot;) {

              }

&lt;script type=&quot;module&quot;&gt;
  const root = document.getElementById(&quot;stack3-slot-sweep&quot;);
  const assets = JSON.parse(root.querySelector(&quot;[data-sweep-assets]&quot;).textContent);
  const chartBase = JSON.parse(root.querySelector(&quot;[data-viz-chart]&quot;).textContent);
  const visibility = root.querySelector(&quot;[data-visibility]&quot;);
  const angle = root.querySelector(&quot;[data-angle]&quot;);
  const camera = root.querySelector(&quot;[data-camera]&quot;);
  const grid = root.querySelector(&quot;[data-grid]&quot;);
  const selection = root.querySelector(&quot;[data-selection]&quot;);
  const metric = root.querySelector(&quot;[data-metric]&quot;);
  const atlas = root.querySelector(&quot;[data-atlas]&quot;);
  const model = root.querySelector(&quot;[data-model]&quot;);
  let active = assets.cases.find(item =&gt; item.id === &quot;exposed-0-8-50&quot;);
  const saved = window.openai?.widgetState?.modelContent;
  if (saved?.id) active = assets.cases.find(item =&gt; item.id === saved.id) ?? active;
  if (saved?.camera === &quot;1&quot;) camera.value = &quot;1&quot;;
  visibility.value = active.visibility;
  let chart;

  const pct = value =&gt; (value * 100).toFixed(1) + &quot;%&quot;;
  const angleLabel = value =&gt; value + &quot;°&quot;;
  const stateLabel = { continuous: &quot;연속 개방&quot;, fragmented: &quot;일부 개방&quot;, closed: &quot;닫힘&quot; };
  const directions = [&quot;TOP&quot;, &quot;LEFT&quot;, &quot;FRONT&quot;, &quot;REAR&quot;];
  function node(tag, value) {
    const result = document.createElement(tag);
    if (value !== undefined) result.textContent = value;
    return result;
  }
  function save() {
    window.openai?.setWidgetState?.({ modelContent: { id: active.id, camera: camera.value } })?.catch(() =&gt; {});
  }
  function renderView() {
    model.src = active.frames[Number(camera.value)];
    model.alt = &quot;기준 형상, 010.030, 010.040 메시를 &quot; + (camera.value === &quot;0&quot; ? &quot;사선&quot; : &quot;위&quot;) + &quot;에서 비교&quot;;
  }
  function renderCase() {
    selection.textContent = &quot;폭 &quot; + pct(active.width) + &quot; · 법선 &quot; + angleLabel(active.angle) +
      &quot; · 위상 &quot; + pct(active.phase);
    metric.textContent = stateLabel[active.before[0]] + &quot; → &quot; + stateLabel[active.after[0]] +
      &quot; · 중심선 개방 &quot; + pct(active.before[1]) + &quot; → &quot; + pct(active.after[1]) +
      &quot; · X 샘플면 이동 &quot; + active.moved + &quot;개&quot;;
    atlas.replaceChildren(...active.views.map((index, direction) =&gt; {
      const figure = node(&quot;figure&quot;);
      const image = node(&quot;img&quot;);
      image.width = 180;
      image.height = 115;
      image.alt = directions[direction] + &quot; 정사영&quot;;
      image.src = assets.images[index];
      const caption = node(&quot;figcaption&quot;, directions[direction]);
      caption.className = &quot;text-small text-muted&quot;;
      figure.append(image, caption);
      return figure;
    }));
    renderView();
    if (chart) chart.config = { ...chartBase, rows: active.rows };
  }
  function updateGrid() {
    const cases = assets.cases.filter(item =&gt; item.visibility === visibility.value &amp;&amp; item.angle === Number(angle.value));
    const widths = [...new Set(cases.map(item =&gt; item.width))];
    const phases = [...new Set(cases.map(item =&gt; item.phase))];
    if (!cases.includes(active)) {
      active = cases.find(item =&gt; item.width === active.width &amp;&amp; item.phase === active.phase) ?? cases[0];
    }
    const thead = node(&quot;thead&quot;), head = node(&quot;tr&quot;);
    for (const label of [&quot;폭 / 위상&quot;, ...phases.map(pct)]) {
      const cell = node(&quot;th&quot;, label);
      cell.scope = &quot;col&quot;;
      head.append(cell);
    }
    thead.append(head);
    const tbody = node(&quot;tbody&quot;);
    for (const width of widths) {
      const row = node(&quot;tr&quot;), label = node(&quot;th&quot;, pct(width));
      label.scope = &quot;row&quot;;
      row.append(label);
      for (const phase of phases) {
        const item = cases.find(c =&gt; c.width === width &amp;&amp; c.phase === phase);
        const cell = node(&quot;td&quot;);
        const before = Math.round(item.before[1] * 100);
        const after = Math.round(item.after[1] * 100);
        const button = node(&quot;button&quot;);
        const beforeLabel = node(&quot;span&quot;, String(before));
        beforeLabel.className = &quot;sweep-transition-before&quot;;
        const transition = node(&quot;span&quot;);
        transition.append(beforeLabel, node(&quot;span&quot;, &quot;→&quot; + after));
        button.append(transition);
        button.className = &quot;btn text-small tabular-nums&quot;;
        button.type = &quot;button&quot;;
        button.setAttribute(&quot;aria-pressed&quot;, String(item === active));
        button.setAttribute(&quot;aria-label&quot;, pct(width) + &quot; 폭, &quot; + pct(phase) + &quot; 위상. &quot; +
          &quot;010.030 &quot; + pct(item.before[1]) + &quot;, 010.040 &quot; + pct(item.after[1]));
        button.addEventListener(&quot;click&quot;, () =&gt; {
          active = item;
          grid.querySelector(&#x27;[aria-pressed=&quot;true&quot;]&#x27;).setAttribute(&quot;aria-pressed&quot;, &quot;false&quot;);
          button.setAttribute(&quot;aria-pressed&quot;, &quot;true&quot;);
          renderCase();
          save();
        });
        cell.append(button);
        row.append(cell);
      }
      tbody.append(row);
    }
    const caption = node(&quot;caption&quot;, &quot;틈 중심선 개방률 (%) · 010.030 → 010.040&quot;);
    caption.className = &quot;text-small text-muted&quot;;
    grid.replaceChildren(caption, thead, tbody);
    renderCase();
  }
  function updateAngles(preferred) {
    const angles = [...new Set(assets.cases.filter(item =&gt; item.visibility === visibility.value).map(item =&gt; item.angle))];
    angle.replaceChildren(...angles.map(value =&gt; new Option(angleLabel(value), value)));
    angle.value = angles.includes(preferred) ? preferred : angles[0];
    updateGrid();
  }
  visibility.addEventListener(&quot;change&quot;, () =&gt; { updateAngles(active.angle); save(); });
  angle.addEventListener(&quot;change&quot;, () =&gt; { updateGrid(); save(); });
  camera.addEventListener(&quot;change&quot;, () =&gt; { renderView(); save(); });
  updateAngles(active.angle);
  try {
    const { mountChart } = await import(&quot;https://persistent.oaistatic.com/plugins/visualize/charts/1.8.1/element.js&quot;);
    chart = mountChart(root.querySelector(&quot;[data-viz-container]&quot;), { ...chartBase, rows: active.rows });
  } catch {
    root.querySelector(&quot;[data-viz-container]&quot;).textContent = &quot;틈 폭 차트를 불러오지 못했습니다.&quot;;
  }
&lt;/script&gt;

&lt;script&gt;
