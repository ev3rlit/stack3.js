name: Release CLI

on:
  push:
    tags:
      - 'cli-v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check && npm test
      - name: Build the installable package
        run: |
          version="${GITHUB_REF_NAME#cli-v}"
          mkdir -p dist
          npm run package:cli -- --version "$version" --output "$RUNNER_TEMP/stack3-package"
          npm pack "$RUNNER_TEMP/stack3-package" --pack-destination dist
          mv "dist/stack3js-$version.tgz" dist/stack3-cli.tgz
          (cd dist && sha256sum stack3-cli.tgz > stack3-cli.tgz.sha256)
      - name: Smoke-test the installed CLI outside the checkout
        run: |
          archive="$GITHUB_WORKSPACE/dist/stack3-cli.tgz"
          prefix="$RUNNER_TEMP/stack3-install"
          npm install --global --prefix "$prefix" --no-audit --no-fund "$archive"
          mkdir "$RUNNER_TEMP/stack3-smoke"
          cd "$RUNNER_TEMP/stack3-smoke"
          stack3="$prefix/bin/stack3"
          test "$("$stack3" --version)" = "${GITHUB_REF_NAME#cli-v}"
          "$stack3" example future-tank
          "$stack3" project get future-tank.stack3.json
          "$stack3" example traffic-cone
          "$stack3" build traffic-cone-4view.png --layout top,left,front,rear --format stack --output cone-stack
          test -s cone-stack/stack.png
          test -s cone-stack/stack.json
          "$stack3" project open future-tank.stack3.json --playground --no-open > preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..40}; do
            if grep -qm1 '^{"file":' preview.log; then break; fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then cat preview.log; exit 1; fi
            sleep .25
          done
          preview=$(grep -m1 '^{"file":' preview.log)
          url=$(node -p 'JSON.parse(process.argv[1]).url' "$preview")
          curl --fail --silent --show-error "$url" -o preview.html
          grep -q 'assets/project-' preview.html
      - uses: actions/upload-artifact@v7
        with:
          name: stack3-cli
          path: |
            dist/stack3-cli.tgz
            dist/stack3-cli.tgz.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: stack3-cli
      - name: Publish the tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum --check stack3-cli.tgz.sha256
          gh release create "$GITHUB_REF_NAME" stack3-cli.tgz stack3-cli.tgz.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --latest
